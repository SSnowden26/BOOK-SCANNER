<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Scanner</title>
  </head>
  <body>
    <div id="lock-screen" class="lock-screen">
      <form id="lock-form">
        <h2>Book Scanner</h2>
        <p>Enter the access code to continue.</p>
        <input id="lock-input" type="password" autocomplete="off" placeholder="Access code" />
        <button type="submit">Unlock</button>
        <p id="lock-error" class="lock-error"></p>
      </form>
    </div>

    <div id="app" class="hidden">
      <header class="topbar">
        <h1>Book Scanner</h1>
        <nav class="tabs">
          <button id="tab-scan" class="tab-btn">Scan</button>
          <button id="tab-library" class="tab-btn active">Library</button>
        </nav>
      </header>

      <div id="status" class="status"></div>

      <main id="panel-scan" class="panel hidden">
        <div id="scanner-view"></div>
        <p class="hint">Point your phone's camera at a book's barcode (ISBN).</p>

        <p class="or-divider">or</p>

        <form id="manual-form" class="manual-form">
          <input
            id="manual-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Type ISBN (10 or 13 digits)"
          />
          <button type="submit">Add</button>
        </form>
      </main>

      <main id="panel-library" class="panel">
        <div class="library-toolbar">
          <label for="filter-select">Filter</label>
          <select id="filter-select">
            <option value="all">All</option>
            <option value="unread">Unread</option>
            <option value="reading">Currently reading</option>
            <option value="read">Read</option>
            <option value="owned">Owned</option>
            <option value="unowned">Unowned</option>
          </select>

          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="added_desc">Date added (newest)</option>
            <option value="added_asc">Date added (oldest)</option>
            <option value="title_asc">Title (A-Z)</option>
            <option value="author_asc">Author (A-Z)</option>
            <option value="status">Status</option>
          </select>
        </div>
        <div id="library-grid" class="library-grid"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
