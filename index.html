<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Scanner</title>
  </head>
  <body>
    <div id="lock-screen" class="lock-screen">
      <form id="lock-form">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v17H6.5a2.5 2.5 0 0 0 0 5H20" />
        </svg>
        <h2>Book Scanner</h2>
        <p>Enter the access code to continue.</p>
        <input id="lock-input" type="password" autocomplete="off" placeholder="Access code" />
        <button type="submit">Unlock</button>
        <p id="lock-error" class="lock-error"></p>
      </form>
    </div>

    <div id="auth-screen" class="lock-screen hidden">
      <form id="auth-form">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v17H6.5a2.5 2.5 0 0 0 0 5H20" />
        </svg>
        <h2 id="auth-heading">Sign In</h2>
        <input id="auth-username" type="text" autocomplete="username" placeholder="Username" />
        <input
          id="auth-password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
        />
        <button type="submit" id="auth-submit-btn">Sign In</button>
        <p id="auth-error" class="lock-error"></p>
        <button type="button" id="auth-toggle-btn" class="auth-toggle-btn">
          Need an account? Sign up
        </button>
      </form>
    </div>

    <div id="app" class="hidden">
      <header class="topbar">
        <h1>
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v17H6.5a2.5 2.5 0 0 0 0 5H20" />
          </svg>
          Book Scanner
        </h1>
        <nav class="tabs">
          <button id="tab-scan" class="tab-btn">Scan &amp; Search</button>
          <button id="tab-library" class="tab-btn active">Library</button>
          <button id="tab-wishlist" class="tab-btn">Wishlist</button>
          <button id="tab-profile" class="tab-btn">Profile</button>
        </nav>
      </header>

      <div id="status" class="status"></div>

      <main id="panel-scan" class="panel hidden">
        <button id="scan-start-btn" type="button" class="scan-start-btn">Scan Barcode</button>
        <div id="scanner-view" class="hidden"></div>

        <p class="or-divider">or</p>

        <form id="manual-form" class="manual-form">
          <input
            id="manual-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Type ISBN (10 or 13 digits)"
          />
          <button type="submit">Add</button>
        </form>

        <p class="or-divider">or</p>

        <form id="wishlist-form" class="manual-form">
          <input
            id="wishlist-input"
            type="text"
            autocomplete="off"
            placeholder="Search by book title"
          />
          <button type="submit">Search</button>
        </form>
        <div id="wishlist-results" class="library-grid"></div>
      </main>

      <main id="panel-library" class="panel">
        <div class="library-toolbar">
          <label for="filter-select">Filter</label>
          <select id="filter-select">
            <option value="all">All</option>
            <option value="unread">Unread</option>
            <option value="reading">Currently reading</option>
            <option value="read">Read</option>
            <option value="owned">Owned</option>
            <option value="wishlisted">Wishlisted</option>
          </select>

          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="added_desc">Date added (newest)</option>
            <option value="added_asc">Date added (oldest)</option>
            <option value="title_asc">Title (A-Z)</option>
            <option value="author_asc">Author (A-Z)</option>
            <option value="status">Status</option>
          </select>
        </div>
        <div id="library-grid" class="library-grid"></div>
      </main>

      <main id="panel-wishlist" class="panel hidden">
        <div id="wishlist-grid" class="library-grid"></div>
      </main>

      <main id="panel-profile" class="panel hidden">
        <div class="profile-card">
          <h2 id="profile-username"></h2>
          <div class="profile-stats">
            <div class="profile-stat">
              <strong id="profile-total">0</strong>
              <span>Books in library</span>
            </div>
            <div class="profile-stat">
              <strong id="profile-read">0</strong>
              <span>Books read</span>
            </div>
          </div>
          <button id="sign-out-btn" type="button" class="sign-out-btn">Sign Out</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
